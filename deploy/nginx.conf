# nginx site for Meal Tracker; certbot adds the HTTPS server block and the redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 15m;   # meal photos

    location /static/ {
        alias /srv/mealtrack/app/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
